<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kinetic Alien — Audio Visualizer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        canvas { display: block; width: 100%; height: 100%; }

        /* Vignette overlay */
        #vignette {
            position: fixed; inset: 0;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.35) 100%);
            pointer-events: none; z-index: 2;
        }

        /* Title watermark */
        #title {
            position: fixed; top: 20px; left: 24px;
            color: rgba(255,255,255,0.12);
            font-size: 11px; font-weight: 700;
            letter-spacing: 5px; text-transform: uppercase;
            z-index: 10;
            transition: opacity 0.5s;
        }

        /* Status text */
        #status {
            position: fixed; top: 20px; right: 24px;
            color: rgba(255,255,255,0.45);
            font-size: 11px; font-weight: 500;
            z-index: 10;
            transition: opacity 0.5s;
        }

        #fileName {
            position: fixed; bottom: 90px;
            left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.4);
            font-size: 12px; z-index: 10;
            text-align: center;
            max-width: 70%;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            opacity: 0; transition: opacity 0.4s;
        }
        #fileName.visible { opacity: 1; }

        /* Audio level meter */
        #levelMeter {
            position: fixed; top: 40px; right: 24px;
            width: 60px; height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            z-index: 10;
            overflow: hidden;
            opacity: 0; transition: opacity 0.4s;
        }
        #levelMeter.visible { opacity: 1; }
        #levelBar {
            height: 100%; width: 0%;
            background: rgba(255,255,255,0.6);
            border-radius: 2px;
            transition: width 0.05s;
        }

        /* Secure context warning */
        #warning {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            color: rgba(255,255,255,0.8);
            padding: 24px 32px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.15);
            font-size: 14px; line-height: 1.6;
            text-align: center;
            max-width: 340px;
            z-index: 100;
            display: none;
        }
        #warning button {
            margin-top: 12px;
            padding: 8px 24px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            color: white; cursor: pointer;
            font-size: 13px;
        }

        /* Controls bar */
        #controls {
            position: fixed; bottom: 0; left: 0; right: 0;
            padding: 16px 20px 24px;
            display: flex; justify-content: center; align-items: center; gap: 10px;
            z-index: 10;
            transition: opacity 0.5s ease;
        }
        #controls.hidden { opacity: 0; pointer-events: none; }

        .ctrl-group {
            display: flex; gap: 8px; align-items: center;
            padding: 8px 14px;
            background: rgba(0,0,0,0.25);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-radius: 28px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .divider {
            width: 1px; height: 28px;
            background: rgba(255,255,255,0.12);
            margin: 0 2px;
        }

        /* Buttons */
        .btn {
            width: 46px; height: 46px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.8);
            font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        .btn:active { transform: scale(0.9); }
        .btn.active {
            border-color: #ff4444;
            background: rgba(255,68,68,0.25);
            color: #fff;
            animation: pulse-glow 1.5s ease-in-out infinite;
        }
        .btn.playing {
            border-color: #44cc66;
            background: rgba(68,204,102,0.2);
            color: #fff;
            animation: pulse-glow-green 1.5s ease-in-out infinite;
        }
        .btn svg { pointer-events: none; }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 8px rgba(255,68,68,0.3); }
            50% { box-shadow: 0 0 18px rgba(255,68,68,0.6); }
        }
        @keyframes pulse-glow-green {
            0%, 100% { box-shadow: 0 0 8px rgba(68,204,102,0.3); }
            50% { box-shadow: 0 0 18px rgba(68,204,102,0.6); }
        }

        .btn-label {
            position: absolute;
            top: -22px; left: 50%;
            transform: translateX(-50%);
            font-size: 9px;
            color: rgba(255,255,255,0.6);
            white-space: nowrap;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-weight: 600;
            opacity: 0; transition: opacity 0.3s;
            pointer-events: none;
        }
        .btn-wrap { position: relative; }
        .btn-wrap:hover .btn-label,
        .btn.active + .btn-label,
        .btn.playing + .btn-label { opacity: 1; }

        /* Theme swatches */
        .theme-btn {
            width: 32px; height: 32px;
            border-radius: 50%;
            border: 2.5px solid transparent;
            cursor: pointer;
            transition: all 0.25s;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            flex-shrink: 0;
        }
        .theme-btn:active { transform: scale(0.85); }
        .theme-btn.active {
            border-color: rgba(255,255,255,0.9);
            transform: scale(1.15);
            box-shadow: 0 0 12px rgba(255,255,255,0.2);
        }

        /* Gain slider */
        .gain-wrap {
            display: flex; align-items: center; gap: 8px;
        }
        .gain-label {
            color: rgba(255,255,255,0.4);
            font-size: 9px; text-transform: uppercase;
            letter-spacing: 1.5px; font-weight: 600;
        }
        .gain-slider {
            -webkit-appearance: none; appearance: none;
            width: 70px; height: 3px;
            background: rgba(255,255,255,0.15);
            border-radius: 2px; outline: none;
        }
        .gain-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px; height: 18px;
            border-radius: 50%;
            background: rgba(255,255,255,0.85);
            cursor: pointer;
        }
        .gain-slider::-moz-range-thumb {
            width: 18px; height: 18px;
            border-radius: 50%; border: none;
            background: rgba(255,255,255,0.85);
            cursor: pointer;
        }

        /* Circular frame viewport */
        #frame {
            position: fixed;
            top: 50%; left: 50%;
            width: min(60vw, 60vh);
            height: min(60vw, 60vh);
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 6px solid #1a1a1a;
            box-shadow:
                0 0 0 max(100vw, 100vh) rgba(8,8,8,0.97),
                inset 0 0 40px rgba(0,0,0,0.4),
                0 0 30px rgba(0,0,0,0.6);
            pointer-events: none;
            z-index: 3;
            display: none;
        }
        #frame.active { display: block; }

        /* Responsive: stack on very small screens */
        @media (max-width: 500px) {
            #controls { flex-wrap: wrap; gap: 8px; }
            .ctrl-group { padding: 6px 10px; }
        }
    </style>
</head>
<body>

<div id="vignette"></div>
<div id="frame"></div>
<div id="title">KINETIC ALIEN</div>
<div id="status"></div>
<div id="levelMeter"><div id="levelBar"></div></div>
<div id="fileName"></div>
<div id="warning">
    Microphone requires <strong>HTTPS</strong> or <strong>localhost</strong>.<br>
    Open via a local server or deploy to Vercel first.<br>
    You can still load audio files directly.
    <br><button onclick="this.parentElement.style.display='none'">Got it</button>
</div>

<div id="controls">
    <div class="ctrl-group" id="themeGroup"></div>
    <div class="ctrl-group">
        <div class="btn-wrap">
            <button class="btn" id="micBtn" title="Microphone">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>

                    <line x1="12" y1="19" x2="12" y2="23"/>
                    <line x1="8" y1="23" x2="16" y2="23"/>
                </svg>
            </button>
            <span class="btn-label" id="micLabel">Mic Off</span>
        </div>
        <div class="btn-wrap">
            <button class="btn" id="playPauseBtn" title="Play / Pause" style="display:none;">
                <svg id="playIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="5,3 19,12 5,21"/>
                </svg>
                <svg id="pauseIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
                    <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
                </svg>
            </button>
        </div>
        <div class="btn-wrap">
            <button class="btn" id="fileBtn" title="Load Audio">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18V5l12-2v13"/>
                    <circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
                </svg>
            </button>
            <span class="btn-label">Music</span>
        </div>
    </div>
    <div class="ctrl-group">
        <div class="btn-wrap">
            <button class="btn" id="frameBtn" title="Toggle Frame">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                </svg>
            </button>
            <span class="btn-label">Frame</span>
        </div>
        <div class="btn-wrap">
            <button class="btn" id="glowBtn" title="Toggle Glow">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"/>
                    <line x1="12" y1="1" x2="12" y2="4"/>
                    <line x1="12" y1="20" x2="12" y2="23"/>
                    <line x1="4.22" y1="4.22" x2="6.34" y2="6.34"/>
                    <line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/>
                    <line x1="1" y1="12" x2="4" y2="12"/>
                    <line x1="20" y1="12" x2="23" y2="12"/>
                    <line x1="4.22" y1="19.78" x2="6.34" y2="17.66"/>
                    <line x1="17.66" y1="6.34" x2="19.78" y2="4.22"/>
                </svg>
            </button>
            <span class="btn-label">Glow</span>
        </div>
    </div>
    <div class="ctrl-group">
        <div class="gain-wrap">
            <span class="gain-label">Gain</span>
            <input type="range" class="gain-slider" id="gainSlider" min="0.5" max="6" step="0.1" value="2.5">
        </div>
    </div>
</div>

<input type="file" id="fileInput" accept="audio/*" hidden>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
// ================================================================
//  KINETIC ALIEN  —  Ferrofluid / Symbiote Audio Visualizer
// ================================================================

// ---- THEMES ----
const THEMES = {
    ferrofluid: {
        bg: [0.91, 0.45, 0.05],
        liquid: [0.012, 0.012, 0.018],
        specular: [0.75, 0.78, 0.88],
        glow: [1.0, 0.5, 0.05],
        iri: 0.2,
        swatch: '#E87410'
    },
    venom: {
        bg: [0.075, 0.11, 0.22],
        liquid: [0.008, 0.008, 0.015],
        specular: [0.45, 0.5, 0.82],
        glow: [0.2, 0.15, 0.6],
        iri: 0.3,
        swatch: '#16213E'
    },
    mercury: {
        bg: [0.0, 0.0, 0.0],
        liquid: [0.82, 0.84, 0.88],
        specular: [1.0, 1.0, 1.0],
        glow: [0.1, 0.35, 0.85],
        iri: 0.08,
        swatch: '#B8BCC4'
    },
    ocean: {
        bg: [0.02, 0.045, 0.1],
        liquid: [0.01, 0.012, 0.028],
        specular: [0.2, 0.5, 0.92],
        glow: [0.0, 0.35, 0.75],
        iri: 0.25,
        swatch: '#0B1E3D'
    },
    crimson: {
        bg: [0.14, 0.02, 0.02],
        liquid: [0.015, 0.008, 0.008],
        specular: [0.92, 0.18, 0.12],
        glow: [0.75, 0.05, 0.02],
        iri: 0.2,
        swatch: '#3D0A0A'
    },
    ember: {
        bg: [0.12, 0.06, 0.01],
        liquid: [0.012, 0.01, 0.008],
        specular: [1.0, 0.55, 0.1],
        glow: [0.9, 0.4, 0.02],
        iri: 0.18,
        swatch: '#5C2E08'
    }
};

let currentTheme = 'ferrofluid';

// ---- GLSL: VERTEX SHADER ----
const vertexShader = /* glsl */`
uniform float uTime;
uniform float uBass;
uniform float uLowMid;
uniform float uMid;
uniform float uHighMid;
uniform float uHigh;

varying vec3 vNormal;
varying vec3 vViewPos;
varying float vDisp;

// ---- Simplex 3D noise (Ashima Arts / Stefan Gustavson) ----
vec4 permute(vec4 x){ return mod(((x*34.0)+1.0)*x, 289.0); }
vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314*r; }

float snoise(vec3 v){
    const vec2 C = vec2(1.0/6.0, 1.0/3.0);
    const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);

    vec3 i  = floor(v + dot(v, C.yyy));
    vec3 x0 = v - i + dot(i, C.xxx);

    vec3 g = step(x0.yzx, x0.xyz);
    vec3 l = 1.0 - g;
    vec3 i1 = min(g, l.zxy);
    vec3 i2 = max(g, l.zxy);

    vec3 x1 = x0 - i1 + C.xxx;
    vec3 x2 = x0 - i2 + C.yyy;
    vec3 x3 = x0 - D.yyy;

    i = mod(i, 289.0);
    vec4 p = permute(permute(permute(
        i.z + vec4(0.0, i1.z, i2.z, 1.0))
      + i.y + vec4(0.0, i1.y, i2.y, 1.0))
      + i.x + vec4(0.0, i1.x, i2.x, 1.0));

    float n_ = 1.0/7.0;
    vec3 ns = n_ * D.wyz - D.xzx;

    vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
    vec4 xp = floor(j * ns.z);
    vec4 yp = floor(j - 7.0 * xp);

    vec4 x4 = xp * ns.x + ns.yyyy;
    vec4 y4 = yp * ns.x + ns.yyyy;
    vec4 h  = 1.0 - abs(x4) - abs(y4);

    vec4 b0 = vec4(x4.xy, y4.xy);
    vec4 b1 = vec4(x4.zw, y4.zw);

    vec4 s0 = floor(b0)*2.0 + 1.0;
    vec4 s1 = floor(b1)*2.0 + 1.0;
    vec4 sh = -step(h, vec4(0.0));

    vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
    vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;

    vec3 p0 = vec3(a0.xy, h.x);
    vec3 p1 = vec3(a0.zw, h.y);
    vec3 p2 = vec3(a1.xy, h.z);
    vec3 p3 = vec3(a1.zw, h.w);

    vec4 norm = taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
    p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;

    vec4 m = max(0.6 - vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)), 0.0);
    m = m*m;
    return 42.0 * dot(m*m, vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}

// Compute displacement at a point (reusable for normal estimation)
float getDisplacement(vec3 pos, float t, float bass, float lowMid, float mid, float highMid, float high) {
    // Ambient: subtle breathing (nearly spherical at rest)
    float d = snoise(pos * 1.5 + t * 0.1) * 0.015;

    // Bass: large organic swells
    float bn = snoise(pos * 0.8 + t * 0.12 + 10.0);
    d += max(bn, 0.0) * bass * 0.6;

    // Low-mid: medium bumps
    float lmn = snoise(pos * 2.0 + t * 0.18 + 20.0);
    d += max(lmn - 0.05, 0.0) * lowMid * 0.5;

    // Mid: spiky protrusions
    float mn = snoise(pos * 3.5 + t * 0.25 + 30.0);
    float midD = max(mn - 0.1, 0.0);
    d += pow(midD, 1.8) * mid * 0.7;

    // High-mid: sharp spikes
    float hmn = snoise(pos * 6.0 + t * 0.32 + 40.0);
    float hmD = max(hmn - 0.15, 0.0);
    d += pow(hmD, 2.2) * highMid * 0.5;

    // Highs: fine needles
    float hn = snoise(pos * 10.0 + t * 0.45 + 50.0);
    float hD = max(hn - 0.2, 0.0);
    d += pow(hD, 3.0) * high * 0.4;

    return d;
}

void main(){
    vec3 pos = position;
    vec3 nrm = normal;
    float t  = uTime;

    float disp = getDisplacement(pos, t, uBass, uLowMid, uMid, uHighMid, uHigh);

    // Sub-bass pulse
    float pulse = 1.0 + uBass * 0.06;

    vec3 displaced = pos * pulse + nrm * disp;

    // Estimate normal by sampling displacement at offset points
    float eps = 0.005;
    vec3 tangent = normalize(cross(nrm, nrm.yzx + vec3(0.1, 0.2, 0.3)));
    vec3 bitangent = normalize(cross(nrm, tangent));
    vec3 posT = pos + tangent * eps;
    vec3 posB = pos + bitangent * eps;
    float dispT = getDisplacement(posT, t, uBass, uLowMid, uMid, uHighMid, uHigh);
    float dispB = getDisplacement(posB, t, uBass, uLowMid, uMid, uHighMid, uHigh);
    vec3 surfT = posT * pulse + normalize(posT) * dispT;
    vec3 surfB = posB * pulse + normalize(posB) * dispB;
    vec3 displacedNormal = normalize(cross(surfT - displaced, surfB - displaced));

    vec4 mvPos = modelViewMatrix * vec4(displaced, 1.0);
    vViewPos = mvPos.xyz;
    vNormal = normalize(normalMatrix * displacedNormal);
    vDisp = disp;

    gl_Position = projectionMatrix * mvPos;
}
`;

// ---- GLSL: FRAGMENT SHADER ----
const fragmentShader = /* glsl */`
uniform vec3 uLiquidColor;
uniform vec3 uSpecularColor;
uniform float uIri;

varying vec3 vNormal;
varying vec3 vViewPos;
varying float vDisp;

void main(){
    vec3 N = normalize(vNormal);
    vec3 V = normalize(-vViewPos);

    // Fresnel (metallic wet look)
    float fresnel = pow(1.0 - max(dot(N, V), 0.0), 4.0);

    // --- Multi-light setup ---
    // Key light (upper-right-front)
    vec3 L1 = normalize(vec3(1.0, 1.2, 0.8));
    float diff1 = max(dot(N, L1), 0.0);
    float spec1 = pow(max(dot(N, normalize(L1 + V)), 0.0), 120.0);

    // Fill light (upper-left)
    vec3 L2 = normalize(vec3(-0.8, 0.9, 0.5));
    float diff2 = max(dot(N, L2), 0.0) * 0.35;
    float spec2 = pow(max(dot(N, normalize(L2 + V)), 0.0), 80.0) * 0.5;

    // Top light (studio ferrofluid look)
    vec3 L3 = normalize(vec3(0.0, 1.0, 0.2));
    float diff3 = max(dot(N, L3), 0.0) * 0.3;
    float spec3 = pow(max(dot(N, normalize(L3 + V)), 0.0), 160.0) * 0.7;

    // Rim / back light
    vec3 L4 = normalize(vec3(0.0, 0.3, -1.0));
    float rim = pow(max(dot(N, L4), 0.0), 2.0) * 0.3;

    // Environment reflection approx
    vec3 R = reflect(-V, N);
    float envGrad = R.y * 0.5 + 0.5;
    vec3 envCol = mix(uLiquidColor * 0.5, uSpecularColor * 0.15, envGrad);

    // Iridescence
    float iriPhase = vDisp * 10.0 + dot(N, V) * 4.0;
    vec3 iri = vec3(
        0.5 + 0.5 * sin(iriPhase * 6.2832),
        0.5 + 0.5 * sin(iriPhase * 6.2832 + 2.094),
        0.5 + 0.5 * sin(iriPhase * 6.2832 + 4.189)
    );

    // Combine
    float ambient = 0.06;
    float diffuse = diff1 + diff2 + diff3;
    vec3 color = uLiquidColor * (ambient + diffuse * 0.4);

    // Specular highlights (sharp, bright)
    color += uSpecularColor * (spec1 * 0.7 + spec2 * 0.35 + spec3 * 0.5);

    // Fresnel edge glow
    color += fresnel * mix(uSpecularColor * 0.6, iri * uIri, uIri) * 0.5;

    // Environment + rim
    color += envCol * fresnel * 0.3;
    color += uSpecularColor * rim * fresnel * 0.6;

    // Spike tip highlight
    color += uSpecularColor * smoothstep(0.15, 0.5, vDisp) * 0.12;

    // Reinhard tone-map + gamma
    color = color / (1.0 + color);
    color = pow(color, vec3(1.0 / 2.2));

    gl_FragColor = vec4(color, 1.0);
}
`;

// ---- THREE.JS SETUP ----
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);

// Target colors for smooth transitions
const targetBg = new THREE.Color();
const currentBg = new THREE.Color();

// ---- FERROFLUID MESH ----
const geo = new THREE.IcosahedronGeometry(1.0, 7);

const uniforms = {
    uTime:      { value: 0 },
    uBass:      { value: 0 },
    uLowMid:    { value: 0 },
    uMid:       { value: 0 },
    uHighMid:   { value: 0 },
    uHigh:      { value: 0 },
    uLiquidColor:  { value: new THREE.Color() },
    uSpecularColor:{ value: new THREE.Color() },
    uIri:       { value: 0.2 }
};

const mat = new THREE.ShaderMaterial({
    vertexShader,
    fragmentShader,
    uniforms,
    extensions: { derivatives: true }
});

const blob = new THREE.Mesh(geo, mat);
scene.add(blob);

// ---- GLOW DISC (backlight behind blob) ----
function createGlowTexture() {
    const c = document.createElement('canvas');
    c.width = 512; c.height = 512;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(256, 256, 0, 256, 256, 256);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.25, 'rgba(255,255,255,0.8)');
    g.addColorStop(0.5, 'rgba(255,255,255,0.3)');
    g.addColorStop(0.75, 'rgba(255,255,255,0.08)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 512, 512);
    return new THREE.CanvasTexture(c);
}

const glowMat = new THREE.SpriteMaterial({
    map: createGlowTexture(),
    color: new THREE.Color(0.1, 0.35, 0.85),
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    opacity: 0.7
});
const glowSprite = new THREE.Sprite(glowMat);
glowSprite.scale.set(5, 5, 1);
glowSprite.position.z = -0.5;
glowSprite.visible = false; // off by default, toggle with button
scene.add(glowSprite);

const targetGlow = new THREE.Color();
let glowEnabled = false;

// ---- ORBIT CONTROLS ----
const orbit = {
    rotX: 0.15, rotY: 0, targetRotX: 0.15, targetRotY: 0,
    dist: 4.5, targetDist: 4.5,
    dragging: false, dragStart: null, hasMoved: false,
    lastX: 0, lastY: 0, pinchDist: 0,

    start(x, y) {
        this.dragging = true;
        this.lastX = x; this.lastY = y;
        this.dragStart = { x, y, t: Date.now() };
        this.hasMoved = false;
    },
    move(x, y) {
        if (!this.dragging) return;
        const dx = x - this.lastX, dy = y - this.lastY;
        if (Math.abs(dx) > 2 || Math.abs(dy) > 2) this.hasMoved = true;
        this.targetRotY += dx * 0.005;
        this.targetRotX += dy * 0.005;
        this.targetRotX = Math.max(-1.2, Math.min(1.2, this.targetRotX));
        this.lastX = x; this.lastY = y;
    },
    end() {
        const wasTap = !this.hasMoved && this.dragStart && (Date.now() - this.dragStart.t < 280);
        this.dragging = false;
        return wasTap;
    },
    zoom(delta) {
        this.targetDist += delta * 0.008;
        this.targetDist = Math.max(2.5, Math.min(10, this.targetDist));
    },
    update() {
        if (!this.dragging) this.targetRotY += 0.0015; // auto-rotate
        this.rotX += (this.targetRotX - this.rotX) * 0.08;
        this.rotY += (this.targetRotY - this.rotY) * 0.08;
        this.dist += (this.targetDist - this.dist) * 0.08;
        camera.position.set(
            Math.sin(this.rotY) * Math.cos(this.rotX) * this.dist,
            Math.sin(this.rotX) * this.dist,
            Math.cos(this.rotY) * Math.cos(this.rotX) * this.dist
        );
        camera.lookAt(0, 0, 0);
    }
};

// Mouse events
renderer.domElement.addEventListener('mousedown', e => { orbit.start(e.clientX, e.clientY); });
window.addEventListener('mousemove', e => { orbit.move(e.clientX, e.clientY); });
window.addEventListener('mouseup', () => { if (orbit.end()) toggleControls(); });
renderer.domElement.addEventListener('wheel', e => { e.preventDefault(); orbit.zoom(e.deltaY); }, { passive: false });

// Touch events
renderer.domElement.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
        orbit.start(e.touches[0].clientX, e.touches[0].clientY);
    } else if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        orbit.pinchDist = Math.sqrt(dx*dx + dy*dy);
    }
}, { passive: true });

renderer.domElement.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length === 1) {
        orbit.move(e.touches[0].clientX, e.touches[0].clientY);
    } else if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const d = Math.sqrt(dx*dx + dy*dy);
        orbit.zoom(-(d - orbit.pinchDist) * 2);
        orbit.pinchDist = d;
    }
}, { passive: false });

renderer.domElement.addEventListener('touchend', () => { if (orbit.end()) toggleControls(); });

// ---- UI CONTROLS VISIBILITY ----
let hideTimer = null;
function showControls() {
    document.getElementById('controls').classList.remove('hidden');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => document.getElementById('controls').classList.add('hidden'), 5000);
}
function toggleControls() {
    const ctrl = document.getElementById('controls');
    if (ctrl.classList.contains('hidden')) { showControls(); }
    else { clearTimeout(hideTimer); ctrl.classList.add('hidden'); }
}
// Keep controls visible while interacting
document.getElementById('controls').addEventListener('pointerdown', () => {
    clearTimeout(hideTimer);
});
document.getElementById('controls').addEventListener('pointerup', () => {
    hideTimer = setTimeout(() => document.getElementById('controls').classList.add('hidden'), 5000);
});
showControls();

// ---- THEME SYSTEM ----
const themeGroup = document.getElementById('themeGroup');
Object.entries(THEMES).forEach(([key, t]) => {
    const btn = document.createElement('button');
    btn.className = 'theme-btn' + (key === currentTheme ? ' active' : '');
    btn.style.background = t.swatch;
    btn.title = key.charAt(0).toUpperCase() + key.slice(1);
    btn.dataset.theme = key;
    btn.addEventListener('click', () => setTheme(key));
    themeGroup.appendChild(btn);
});

function setTheme(name) {
    const t = THEMES[name];
    if (!t) return;
    currentTheme = name;
    targetBg.setRGB(t.bg[0], t.bg[1], t.bg[2]);
    targetLiquid.setRGB(t.liquid[0], t.liquid[1], t.liquid[2]);
    targetSpec.setRGB(t.specular[0], t.specular[1], t.specular[2]);
    targetGlow.setRGB(t.glow[0], t.glow[1], t.glow[2]);
    targetIri = t.iri;
    document.querySelectorAll('.theme-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.theme === name);
    });
}

const targetLiquid = new THREE.Color();
const targetSpec = new THREE.Color();
let targetIri = 0.2;

// Initialize theme
setTheme(currentTheme);
currentBg.copy(targetBg);
uniforms.uLiquidColor.value.copy(targetLiquid);
uniforms.uSpecularColor.value.copy(targetSpec);
uniforms.uIri.value = targetIri;
glowMat.color.copy(targetGlow);

// ---- AUDIO ENGINE ----
let audioCtx = null;
let analyser = null;
let freqData = null;
let micStream = null;
let micSource = null;
let audioEl = null;
let audioSource = null;
let audioState = 'idle'; // idle | mic | playing | paused
let gain = 2.5;

// Smoothed band values
const bands = { bass: 0, lowMid: 0, mid: 0, highMid: 0, high: 0 };

function initAudio() {
    if (audioCtx) return audioCtx;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.7;
    analyser.minDecibels = -100;
    analyser.maxDecibels = -20;
    freqData = new Uint8Array(analyser.frequencyBinCount);
    return audioCtx;
}

async function startMic() {
    // Check secure context (mic requires HTTPS or localhost)
    if (!window.isSecureContext) {
        document.getElementById('warning').style.display = 'block';
        return;
    }
    try {
        initAudio();
        if (audioCtx.state === 'suspended') await audioCtx.resume();

        // Stop file playback if active
        stopFile();

        const stream = await navigator.mediaDevices.getUserMedia({
            audio: {
                echoCancellation: false,
                noiseSuppression: false,
                autoGainControl: false
            }
        });
        micStream = stream;
        micSource = audioCtx.createMediaStreamSource(stream);
        micSource.connect(analyser);
        // Do NOT connect analyser to destination (avoid feedback)

        audioState = 'mic';
        document.getElementById('micBtn').classList.add('active');
        document.getElementById('micLabel').textContent = 'Mic On';
        document.getElementById('status').textContent = 'Listening...';
        document.getElementById('levelMeter').classList.add('visible');
    } catch (e) {
        console.warn('Mic access denied:', e);
        document.getElementById('status').textContent = 'Mic denied';
        setTimeout(() => { if (audioState === 'idle') document.getElementById('status').textContent = ''; }, 3000);
    }
}

function stopMic() {
    if (micSource) { micSource.disconnect(); micSource = null; }
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    document.getElementById('micBtn').classList.remove('active');
    document.getElementById('micLabel').textContent = 'Mic Off';
    document.getElementById('levelMeter').classList.remove('visible');
    if (audioState === 'mic') {
        audioState = 'idle';
        document.getElementById('status').textContent = '';
    }
}

function loadFile(file) {
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    stopMic();
    stopFile();

    audioEl = new Audio();
    audioEl.crossOrigin = 'anonymous';
    audioEl.src = URL.createObjectURL(file);
    audioSource = audioCtx.createMediaElementSource(audioEl);
    audioSource.connect(analyser);
    analyser.connect(audioCtx.destination);

    audioEl.play();
    audioState = 'playing';

    const name = file.name.replace(/\.[^.]+$/, '');
    document.getElementById('fileName').textContent = name;
    document.getElementById('fileName').classList.add('visible');
    document.getElementById('status').textContent = 'Playing';
    document.getElementById('levelMeter').classList.add('visible');
    showPlayPause(true);
    updatePlayPauseIcon();

    audioEl.addEventListener('ended', () => {
        audioState = 'paused';
        updatePlayPauseIcon();
        document.getElementById('status').textContent = 'Ended';
    });
}

function stopFile() {
    if (audioEl) {
        audioEl.pause();
        audioEl.src = '';
        audioEl = null;
    }
    if (audioSource) { audioSource.disconnect(); audioSource = null; }
    document.getElementById('fileName').classList.remove('visible');
    document.getElementById('levelMeter').classList.remove('visible');
    showPlayPause(false);
    if (audioState === 'playing' || audioState === 'paused') {
        audioState = 'idle';
        document.getElementById('status').textContent = '';
    }
}

function togglePlayPause() {
    if (!audioEl) return;
    if (audioState === 'playing') {
        audioEl.pause();
        audioState = 'paused';
        document.getElementById('status').textContent = 'Paused';
    } else {
        audioEl.play();
        audioState = 'playing';
        document.getElementById('status').textContent = 'Playing';
    }
    updatePlayPauseIcon();
}

function showPlayPause(show) {
    document.getElementById('playPauseBtn').style.display = show ? 'flex' : 'none';
}

function updatePlayPauseIcon() {
    const playing = audioState === 'playing';
    document.getElementById('playIcon').style.display = playing ? 'none' : 'block';
    document.getElementById('pauseIcon').style.display = playing ? 'block' : 'none';
}

function updateAudioData() {
    if (!analyser || !freqData || audioState === 'idle') {
        // Decay to zero
        bands.bass    *= 0.92;
        bands.lowMid  *= 0.92;
        bands.mid     *= 0.92;
        bands.highMid *= 0.92;
        bands.high    *= 0.92;
        return;
    }
    analyser.getByteFrequencyData(freqData);

    const bins = freqData.length; // 256 bins with fftSize 512

    const avg = (arr, s, e) => {
        let sum = 0;
        for (let i = s; i < e; i++) sum += arr[i];
        return (sum / (e - s)) / 255.0;
    };

    const g = gain;
    // Frequency bands mapped for 256 bins (~86 Hz per bin at 44.1kHz)
    const raw = {
        bass:    Math.min(avg(freqData, 0, 8)    * g, 1),   // ~0-690 Hz
        lowMid:  Math.min(avg(freqData, 8, 24)   * g, 1),   // ~690-2070 Hz
        mid:     Math.min(avg(freqData, 24, 64)  * g, 1),   // ~2-5.5 kHz
        highMid: Math.min(avg(freqData, 64, 128) * g, 1),   // ~5.5-11 kHz
        high:    Math.min(avg(freqData, 128, bins) * g, 1)   // ~11-22 kHz
    };

    // Smooth (lower = more responsive)
    const s = 0.35;
    bands.bass    += (raw.bass    - bands.bass)    * s;
    bands.lowMid  += (raw.lowMid  - bands.lowMid)  * s;
    bands.mid     += (raw.mid     - bands.mid)     * s;
    bands.highMid += (raw.highMid - bands.highMid) * s;
    bands.high    += (raw.high    - bands.high)    * s;

    // Update level meter
    const overall = (bands.bass + bands.lowMid + bands.mid + bands.highMid + bands.high) / 5;
    const levelBar = document.getElementById('levelBar');
    if (levelBar) levelBar.style.width = Math.min(overall * 100 * 2, 100) + '%';
}

// ---- UI EVENT HANDLERS ----
document.getElementById('micBtn').addEventListener('click', () => {
    if (audioState === 'mic') stopMic();
    else startMic();
});

document.getElementById('fileBtn').addEventListener('click', () => {
    document.getElementById('fileInput').click();
});

document.getElementById('fileInput').addEventListener('change', e => {
    const file = e.target.files[0];
    if (file) loadFile(file);
    e.target.value = ''; // allow reloading same file
});

document.getElementById('playPauseBtn').addEventListener('click', togglePlayPause);

document.getElementById('gainSlider').addEventListener('input', e => {
    gain = parseFloat(e.target.value);
});

// Frame toggle
document.getElementById('frameBtn').addEventListener('click', () => {
    const frame = document.getElementById('frame');
    frame.classList.toggle('active');
    document.getElementById('frameBtn').classList.toggle('active', frame.classList.contains('active'));
});

// Glow toggle
document.getElementById('glowBtn').addEventListener('click', () => {
    glowEnabled = !glowEnabled;
    glowSprite.visible = glowEnabled;
    document.getElementById('glowBtn').classList.toggle('active', glowEnabled);
});

// ---- RESIZE ----
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---- ANIMATION LOOP ----
const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);

    const t = clock.getElapsedTime();

    // Update audio
    updateAudioData();

    // Update uniforms
    uniforms.uTime.value = t;
    uniforms.uBass.value    = bands.bass;
    uniforms.uLowMid.value  = bands.lowMid;
    uniforms.uMid.value     = bands.mid;
    uniforms.uHighMid.value = bands.highMid;
    uniforms.uHigh.value    = bands.high;

    // Smooth theme transitions
    currentBg.lerp(targetBg, 0.04);
    renderer.setClearColor(currentBg);
    uniforms.uLiquidColor.value.lerp(targetLiquid, 0.04);
    uniforms.uSpecularColor.value.lerp(targetSpec, 0.04);
    uniforms.uIri.value += (targetIri - uniforms.uIri.value) * 0.04;

    // Glow: smooth color transition + audio pulse
    if (glowEnabled) {
        glowMat.color.lerp(targetGlow, 0.04);
        const energy = (bands.bass + bands.mid) * 0.5;
        glowMat.opacity = 0.5 + energy * 0.5;
        const glowScale = 4.5 + energy * 2.0;
        glowSprite.scale.set(glowScale, glowScale, 1);
    }

    // Gentle bobbing
    blob.position.y = Math.sin(t * 0.4) * 0.06;

    // Update orbit camera
    orbit.update();

    renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
