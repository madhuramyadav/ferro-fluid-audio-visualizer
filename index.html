<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kinetic Alien — Audio Visualizer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        canvas { display: block; width: 100%; height: 100%; }

        /* Vignette overlay */
        #vignette {
            position: fixed; inset: 0;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.35) 100%);
            pointer-events: none; z-index: 2;
        }

        /* Title watermark */
        #title {
            position: fixed; top: 20px; left: 24px;
            color: rgba(255,255,255,0.12);
            font-size: 11px; font-weight: 700;
            letter-spacing: 5px; text-transform: uppercase;
            z-index: 10;
            transition: opacity 0.5s;
        }

        /* Status text */
        #status {
            position: fixed; top: 20px; right: 24px;
            color: rgba(255,255,255,0.45);
            font-size: 11px; font-weight: 500;
            z-index: 10;
            transition: opacity 0.5s;
        }

        #fileName {
            position: fixed; bottom: 90px;
            left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.4);
            font-size: 12px; z-index: 10;
            text-align: center;
            max-width: 70%;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            opacity: 0; transition: opacity 0.4s;
        }
        #fileName.visible { opacity: 1; }

        /* Audio level meter */
        #levelMeter {
            position: fixed; top: 40px; right: 24px;
            width: 60px; height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            z-index: 10;
            overflow: hidden;
            opacity: 0; transition: opacity 0.4s;
        }
        #levelMeter.visible { opacity: 1; }
        #levelBar {
            height: 100%; width: 0%;
            background: rgba(255,255,255,0.6);
            border-radius: 2px;
            transition: width 0.05s;
        }

        /* Secure context warning */
        #warning {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            color: rgba(255,255,255,0.8);
            padding: 24px 32px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.15);
            font-size: 14px; line-height: 1.6;
            text-align: center;
            max-width: 340px;
            z-index: 100;
            display: none;
        }
        #warning button {
            margin-top: 12px;
            padding: 8px 24px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            color: white; cursor: pointer;
            font-size: 13px;
        }

        /* Controls bar */
        #controls {
            position: fixed; bottom: 0; left: 0; right: 0;
            padding: 16px 20px 24px;
            display: flex; justify-content: center; align-items: center; gap: 10px;
            z-index: 10;
            transition: opacity 0.5s ease;
        }
        #controls.hidden { opacity: 0; pointer-events: none; }

        .ctrl-group {
            display: flex; gap: 8px; align-items: center;
            padding: 8px 14px;
            background: rgba(0,0,0,0.25);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-radius: 28px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .divider {
            width: 1px; height: 28px;
            background: rgba(255,255,255,0.12);
            margin: 0 2px;
        }

        /* Buttons */
        .btn {
            width: 46px; height: 46px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.8);
            font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        .btn:active { transform: scale(0.9); }
        .btn.active {
            border-color: #ff4444;
            background: rgba(255,68,68,0.25);
            color: #fff;
            animation: pulse-glow 1.5s ease-in-out infinite;
        }
        .btn.playing {
            border-color: #44cc66;
            background: rgba(68,204,102,0.2);
            color: #fff;
            animation: pulse-glow-green 1.5s ease-in-out infinite;
        }
        .btn svg { pointer-events: none; }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 8px rgba(255,68,68,0.3); }
            50% { box-shadow: 0 0 18px rgba(255,68,68,0.6); }
        }
        @keyframes pulse-glow-green {
            0%, 100% { box-shadow: 0 0 8px rgba(68,204,102,0.3); }
            50% { box-shadow: 0 0 18px rgba(68,204,102,0.6); }
        }

        .btn-label {
            position: absolute;
            top: -22px; left: 50%;
            transform: translateX(-50%);
            font-size: 9px;
            color: rgba(255,255,255,0.6);
            white-space: nowrap;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-weight: 600;
            opacity: 0; transition: opacity 0.3s;
            pointer-events: none;
        }
        .btn-wrap { position: relative; }
        .btn-wrap:hover .btn-label,
        .btn.active + .btn-label,
        .btn.playing + .btn-label { opacity: 1; }

        /* Theme swatches */
        .theme-btn {
            width: 32px; height: 32px;
            border-radius: 50%;
            border: 2.5px solid transparent;
            cursor: pointer;
            transition: all 0.25s;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            flex-shrink: 0;
        }
        .theme-btn:active { transform: scale(0.85); }
        .theme-btn.active {
            border-color: rgba(255,255,255,0.9);
            transform: scale(1.15);
            box-shadow: 0 0 12px rgba(255,255,255,0.2);
        }

        /* Gain slider */
        .gain-wrap {
            display: flex; align-items: center; gap: 8px;
        }
        .gain-label {
            color: rgba(255,255,255,0.4);
            font-size: 9px; text-transform: uppercase;
            letter-spacing: 1.5px; font-weight: 600;
        }
        .gain-slider {
            -webkit-appearance: none; appearance: none;
            width: 70px; height: 3px;
            background: rgba(255,255,255,0.15);
            border-radius: 2px; outline: none;
        }
        .gain-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px; height: 18px;
            border-radius: 50%;
            background: rgba(255,255,255,0.85);
            cursor: pointer;
        }
        .gain-slider::-moz-range-thumb {
            width: 18px; height: 18px;
            border-radius: 50%; border: none;
            background: rgba(255,255,255,0.85);
            cursor: pointer;
        }

        /* View mode buttons */
        .view-btn {
            padding: 6px 14px;
            border-radius: 16px;
            border: 1.5px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.5);
            font-size: 11px; font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.25s;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        .view-btn:active { transform: scale(0.92); }
        .view-btn.active {
            border-color: rgba(255,255,255,0.6);
            background: rgba(255,255,255,0.15);
            color: #fff;
        }

        /* Circular frame viewport */
        #frame {
            position: fixed;
            top: 50%; left: 50%;
            width: min(60vw, 60vh);
            height: min(60vw, 60vh);
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 6px solid #1a1a1a;
            box-shadow:
                0 0 0 max(100vw, 100vh) rgba(8,8,8,0.97),
                inset 0 0 40px rgba(0,0,0,0.4),
                0 0 30px rgba(0,0,0,0.6);
            pointer-events: none;
            z-index: 3;
            display: none;
        }
        #frame.active { display: block; }

        /* Responsive: stack on very small screens */
        @media (max-width: 500px) {
            #controls { flex-wrap: wrap; gap: 8px; }
            .ctrl-group { padding: 6px 10px; }
        }
    </style>
</head>
<body>

<div id="vignette"></div>
<div id="frame"></div>
<div id="title">KINETIC ALIEN</div>
<div id="status"></div>
<div id="levelMeter"><div id="levelBar"></div></div>
<div id="fileName"></div>
<div id="warning">
    Microphone requires <strong>HTTPS</strong> or <strong>localhost</strong>.<br>
    Open via a local server or deploy to Vercel first.<br>
    You can still load audio files directly.
    <br><button onclick="this.parentElement.style.display='none'">Got it</button>
</div>

<div id="controls">
    <div class="ctrl-group" id="themeGroup"></div>
    <div class="ctrl-group">
        <div class="btn-wrap">
            <button class="btn" id="micBtn" title="Microphone">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" y1="19" x2="12" y2="23"/>
                    <line x1="8" y1="23" x2="16" y2="23"/>
                </svg>
            </button>
            <span class="btn-label" id="micLabel">Mic Off</span>
        </div>
        <div class="btn-wrap">
            <button class="btn" id="playPauseBtn" title="Play / Pause" style="display:none;">
                <svg id="playIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="5,3 19,12 5,21"/>
                </svg>
                <svg id="pauseIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
                    <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
                </svg>
            </button>
        </div>
        <div class="btn-wrap">
            <button class="btn" id="fileBtn" title="Load Audio">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18V5l12-2v13"/>
                    <circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
                </svg>
            </button>
            <span class="btn-label">Music</span>
        </div>
    </div>
    <div class="ctrl-group" id="viewModes">
        <button class="view-btn active" data-view="free">Free</button>
        <button class="view-btn" data-view="display">Display</button>
        <button class="view-btn" data-view="spotlight">Spotlight</button>
    </div>
    <div class="ctrl-group">
        <div class="gain-wrap">
            <span class="gain-label">Gain</span>
            <input type="range" class="gain-slider" id="gainSlider" min="1" max="12" step="0.1" value="5.0">
        </div>
    </div>
</div>

<input type="file" id="fileInput" accept="audio/*" hidden>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
// ================================================================
//  KINETIC ALIEN  —  Ferrofluid / Symbiote Audio Visualizer
// ================================================================

// ---- THEMES ----
const THEMES = {
    ferrofluid: {
        bg: [0.91, 0.45, 0.05],
        liquid: [0.012, 0.012, 0.018],
        specular: [0.75, 0.78, 0.88],
        glow: [1.0, 0.5, 0.05],
        iri: 0.2,
        swatch: '#E87410'
    },
    venom: {
        bg: [0.075, 0.11, 0.22],
        liquid: [0.008, 0.008, 0.015],
        specular: [0.45, 0.5, 0.82],
        glow: [0.2, 0.15, 0.6],
        iri: 0.3,
        swatch: '#16213E'
    },
    mercury: {
        bg: [0.0, 0.0, 0.0],
        liquid: [0.82, 0.84, 0.88],
        specular: [1.0, 1.0, 1.0],
        glow: [0.1, 0.35, 0.85],
        iri: 0.08,
        swatch: '#B8BCC4'
    },
    ocean: {
        bg: [0.02, 0.045, 0.1],
        liquid: [0.01, 0.012, 0.028],
        specular: [0.2, 0.5, 0.92],
        glow: [0.0, 0.35, 0.75],
        iri: 0.25,
        swatch: '#0B1E3D'
    },
    crimson: {
        bg: [0.14, 0.02, 0.02],
        liquid: [0.015, 0.008, 0.008],
        specular: [0.92, 0.18, 0.12],
        glow: [0.75, 0.05, 0.02],
        iri: 0.2,
        swatch: '#3D0A0A'
    },
    ember: {
        bg: [0.12, 0.06, 0.01],
        liquid: [0.012, 0.01, 0.008],
        specular: [1.0, 0.55, 0.1],
        glow: [0.9, 0.4, 0.02],
        iri: 0.18,
        swatch: '#5C2E08'
    }
};

let currentTheme = 'ferrofluid';

// ---- THREE.JS SETUP ----
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);

// Target colors for smooth transitions
const targetBg = new THREE.Color();
const currentBg = new THREE.Color();

// ---- LIGHTS ----
scene.add(new THREE.AmbientLight(0x404040));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.0);
keyLight.position.set(3, 4, 2);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0x6688cc, 0.4);
fillLight.position.set(-2, 1, -3);
scene.add(fillLight);
const rimLight = new THREE.DirectionalLight(0xffffff, 0.3);
rimLight.position.set(0, -1, -2);
scene.add(rimLight);

// ---- CORE SPHERE (tiny metallic ball) ----
const CORE_RADIUS = 0.025;
const coreGeo = new THREE.SphereGeometry(CORE_RADIUS, 32, 32);
const coreMat = new THREE.MeshPhongMaterial({
    color: 0x080810,
    specular: 0x999aaa,
    shininess: 200
});
const core = new THREE.Mesh(coreGeo, coreMat);

// ---- SPIKE SYSTEM (instanced thin cones) ----
const SPIKE_COUNT = 180;
const spikeGeo = new THREE.ConeGeometry(1, 1, 4);
spikeGeo.translate(0, 0.5, 0); // base at origin, tip at y=1

const spikeMat = new THREE.MeshPhongMaterial({
    color: 0x080810,
    specular: 0x999aaa,
    shininess: 180
});
const spikeMesh = new THREE.InstancedMesh(spikeGeo, spikeMat, SPIKE_COUNT);

// Pre-compute spike directions (Fibonacci sphere for even distribution)
const spikeData = [];
const golden = Math.PI * (1 + Math.sqrt(5));
const yUp = new THREE.Vector3(0, 1, 0);

for (let i = 0; i < SPIKE_COUNT; i++) {
    const y = 1 - (i / (SPIKE_COUNT - 1)) * 2;
    const r = Math.sqrt(1 - y * y);
    const theta = golden * i;
    const dir = new THREE.Vector3(Math.cos(theta) * r, y, Math.sin(theta) * r).normalize();

    spikeData.push({
        dir,
        bandIndex: Math.floor(Math.random() * 5),
        phase: Math.random() * Math.PI * 2,
        speed: 0.2 + Math.random() * 0.5,
        sensitivity: 0.5 + Math.random() * 1.5,
        threshold: 0.04 + Math.random() * 0.18, // activation threshold — different per spike
        thickness: 0.0012 + Math.random() * 0.0018,
        currentHeight: 0 // for smooth interpolation
    });
}

// Group so we can rotate core + spikes together
const organism = new THREE.Group();
organism.add(core);
organism.add(spikeMesh);
scene.add(organism);

// Reusable objects for spike matrix updates
const _mat4 = new THREE.Matrix4();
const _quat = new THREE.Quaternion();
const _pos = new THREE.Vector3();
const _scl = new THREE.Vector3();

function updateSpikes(t, bands) {
    const bandValues = [bands.bass, bands.lowMid, bands.mid, bands.highMid, bands.high];
    const energy = (bands.bass + bands.lowMid + bands.mid + bands.highMid + bands.high) / 5;

    // Separation gap: spikes detach from core when loud
    const gap = Math.min(energy, 0.5) * 0.12;

    for (let i = 0; i < SPIKE_COUNT; i++) {
        const s = spikeData[i];

        // Audio amplitude — only above this spike's threshold (filters noise floor)
        const rawAmp = bandValues[s.bandIndex];
        const amp = Math.max(rawAmp - s.threshold, 0) * s.sensitivity;

        // Subtle ambient breathing (barely visible nubs at rest)
        const ambientPulse = Math.sin(t * s.speed * 0.3 + s.phase) * 0.5 + 0.5;
        const ambientH = 0.004 * ambientPulse;

        // Target height: audio-driven + tiny ambient
        const targetHeight = Math.max(amp * 0.35, ambientH);

        // Smooth interpolation — organic growth and shrink
        s.currentHeight += (targetHeight - s.currentHeight) * 0.1;
        const height = s.currentHeight;

        // Orient cone outward
        _quat.setFromUnitVectors(yUp, s.dir);

        if (height < 0.001) {
            // Spike invisible — hide it
            _scl.set(0, 0, 0);
            _pos.set(0, 0, 0);
        } else {
            // Thickness scales slightly with height
            const thick = s.thickness * (0.6 + height * 3.0);

            // Position: core surface + gap
            const startR = CORE_RADIUS + (height > 0.005 ? gap : 0);
            _pos.copy(s.dir).multiplyScalar(startR);
            _scl.set(thick, height, thick);
        }

        _mat4.compose(_pos, _quat, _scl);
        spikeMesh.setMatrixAt(i, _mat4);
    }
    spikeMesh.instanceMatrix.needsUpdate = true;
}

// ---- GLOW DISC (backlight behind blob) ----
function createGlowTexture() {
    const c = document.createElement('canvas');
    c.width = 512; c.height = 512;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(256, 256, 0, 256, 256, 256);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.25, 'rgba(255,255,255,0.8)');
    g.addColorStop(0.5, 'rgba(255,255,255,0.3)');
    g.addColorStop(0.75, 'rgba(255,255,255,0.08)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 512, 512);
    return new THREE.CanvasTexture(c);
}

const glowMat = new THREE.SpriteMaterial({
    map: createGlowTexture(),
    color: new THREE.Color(0.1, 0.35, 0.85),
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    opacity: 0.7
});
const glowSprite = new THREE.Sprite(glowMat);
glowSprite.scale.set(5, 5, 1);
glowSprite.position.z = -0.5;
glowSprite.visible = false; // off by default, toggle with button
scene.add(glowSprite);

const targetGlow = new THREE.Color();
let glowEnabled = false;

// ---- ORBIT CONTROLS ----
const orbit = {
    rotX: 0.15, rotY: 0, targetRotX: 0.15, targetRotY: 0,
    dist: 2.5, targetDist: 2.5,
    dragging: false, dragStart: null, hasMoved: false,
    lastX: 0, lastY: 0, pinchDist: 0,

    start(x, y) {
        this.dragging = true;
        this.lastX = x; this.lastY = y;
        this.dragStart = { x, y, t: Date.now() };
        this.hasMoved = false;
    },
    move(x, y) {
        if (!this.dragging) return;
        const dx = x - this.lastX, dy = y - this.lastY;
        if (Math.abs(dx) > 2 || Math.abs(dy) > 2) this.hasMoved = true;
        this.targetRotY += dx * 0.005;
        this.targetRotX += dy * 0.005;
        this.targetRotX = Math.max(-1.2, Math.min(1.2, this.targetRotX));
        this.lastX = x; this.lastY = y;
    },
    end() {
        const wasTap = !this.hasMoved && this.dragStart && (Date.now() - this.dragStart.t < 280);
        this.dragging = false;
        return wasTap;
    },
    zoom(delta) {
        this.targetDist += delta * 0.008;
        this.targetDist = Math.max(1.5, Math.min(8, this.targetDist));
    },
    update() {
        if (!this.dragging) this.targetRotY += 0.0006; // slow auto-rotate
        this.rotX += (this.targetRotX - this.rotX) * 0.08;
        this.rotY += (this.targetRotY - this.rotY) * 0.08;
        this.dist += (this.targetDist - this.dist) * 0.08;
        camera.position.set(
            Math.sin(this.rotY) * Math.cos(this.rotX) * this.dist,
            Math.sin(this.rotX) * this.dist,
            Math.cos(this.rotY) * Math.cos(this.rotX) * this.dist
        );
        camera.lookAt(0, 0, 0);
    }
};

// Mouse events
renderer.domElement.addEventListener('mousedown', e => { orbit.start(e.clientX, e.clientY); });
window.addEventListener('mousemove', e => { orbit.move(e.clientX, e.clientY); });
window.addEventListener('mouseup', () => { if (orbit.end()) toggleControls(); });
renderer.domElement.addEventListener('wheel', e => { e.preventDefault(); orbit.zoom(e.deltaY); }, { passive: false });

// Touch events
renderer.domElement.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
        orbit.start(e.touches[0].clientX, e.touches[0].clientY);
    } else if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        orbit.pinchDist = Math.sqrt(dx*dx + dy*dy);
    }
}, { passive: true });

renderer.domElement.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length === 1) {
        orbit.move(e.touches[0].clientX, e.touches[0].clientY);
    } else if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const d = Math.sqrt(dx*dx + dy*dy);
        orbit.zoom(-(d - orbit.pinchDist) * 2);
        orbit.pinchDist = d;
    }
}, { passive: false });

renderer.domElement.addEventListener('touchend', () => { if (orbit.end()) toggleControls(); });

// ---- UI CONTROLS VISIBILITY ----
let hideTimer = null;
function showControls() {
    document.getElementById('controls').classList.remove('hidden');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => document.getElementById('controls').classList.add('hidden'), 5000);
}
function toggleControls() {
    const ctrl = document.getElementById('controls');
    if (ctrl.classList.contains('hidden')) { showControls(); }
    else { clearTimeout(hideTimer); ctrl.classList.add('hidden'); }
}
// Keep controls visible while interacting
document.getElementById('controls').addEventListener('pointerdown', () => {
    clearTimeout(hideTimer);
});
document.getElementById('controls').addEventListener('pointerup', () => {
    hideTimer = setTimeout(() => document.getElementById('controls').classList.add('hidden'), 5000);
});
showControls();

// ---- THEME SYSTEM ----
const themeGroup = document.getElementById('themeGroup');
Object.entries(THEMES).forEach(([key, t]) => {
    const btn = document.createElement('button');
    btn.className = 'theme-btn' + (key === currentTheme ? ' active' : '');
    btn.style.background = t.swatch;
    btn.title = key.charAt(0).toUpperCase() + key.slice(1);
    btn.dataset.theme = key;
    btn.addEventListener('click', () => setTheme(key));
    themeGroup.appendChild(btn);
});

function setTheme(name) {
    const t = THEMES[name];
    if (!t) return;
    currentTheme = name;
    targetBg.setRGB(t.bg[0], t.bg[1], t.bg[2]);
    targetLiquid.setRGB(t.liquid[0], t.liquid[1], t.liquid[2]);
    targetSpec.setRGB(t.specular[0], t.specular[1], t.specular[2]);
    targetGlow.setRGB(t.glow[0], t.glow[1], t.glow[2]);
    targetIri = t.iri;
    document.querySelectorAll('.theme-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.theme === name);
    });
}

const targetLiquid = new THREE.Color();
const targetSpec = new THREE.Color();
let targetIri = 0.2;

// Initialize theme
setTheme(currentTheme);
currentBg.copy(targetBg);
coreMat.color.copy(targetLiquid);
coreMat.specular.copy(targetSpec);
spikeMat.color.copy(targetLiquid);
spikeMat.specular.copy(targetSpec);
glowMat.color.copy(targetGlow);

// ---- AUDIO ENGINE ----
let audioCtx = null;
let analyser = null;
let freqData = null;
let micStream = null;
let micSource = null;
let audioEl = null;
let audioSource = null;
let audioState = 'idle'; // idle | mic | playing | paused
let gain = 5.0;

// Smoothed band values
const bands = { bass: 0, lowMid: 0, mid: 0, highMid: 0, high: 0 };

function initAudio() {
    if (audioCtx) return audioCtx;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.7;
    analyser.minDecibels = -110;
    analyser.maxDecibels = -10;
    freqData = new Uint8Array(analyser.frequencyBinCount);
    return audioCtx;
}

async function startMic() {
    // Check secure context (mic requires HTTPS or localhost)
    if (!window.isSecureContext) {
        document.getElementById('warning').style.display = 'block';
        return;
    }
    try {
        initAudio();
        if (audioCtx.state === 'suspended') await audioCtx.resume();

        // Stop file playback if active
        stopFile();

        const stream = await navigator.mediaDevices.getUserMedia({
            audio: {
                echoCancellation: false,
                noiseSuppression: false,
                autoGainControl: false
            }
        });
        micStream = stream;
        micSource = audioCtx.createMediaStreamSource(stream);
        micSource.connect(analyser);
        // Do NOT connect analyser to destination (avoid feedback)

        audioState = 'mic';
        document.getElementById('micBtn').classList.add('active');
        document.getElementById('micLabel').textContent = 'Mic On';
        document.getElementById('status').textContent = 'Listening...';
        document.getElementById('levelMeter').classList.add('visible');
    } catch (e) {
        console.warn('Mic access denied:', e);
        document.getElementById('status').textContent = 'Mic denied';
        setTimeout(() => { if (audioState === 'idle') document.getElementById('status').textContent = ''; }, 3000);
    }
}

function stopMic() {
    if (micSource) { micSource.disconnect(); micSource = null; }
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    document.getElementById('micBtn').classList.remove('active');
    document.getElementById('micLabel').textContent = 'Mic Off';
    document.getElementById('levelMeter').classList.remove('visible');
    if (audioState === 'mic') {
        audioState = 'idle';
        document.getElementById('status').textContent = '';
    }
}

function loadFile(file) {
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    stopMic();
    stopFile();

    audioEl = new Audio();
    audioEl.crossOrigin = 'anonymous';
    audioEl.src = URL.createObjectURL(file);
    audioSource = audioCtx.createMediaElementSource(audioEl);
    audioSource.connect(analyser);
    analyser.connect(audioCtx.destination);

    audioEl.play();
    audioState = 'playing';

    const name = file.name.replace(/\.[^.]+$/, '');
    document.getElementById('fileName').textContent = name;
    document.getElementById('fileName').classList.add('visible');
    document.getElementById('status').textContent = 'Playing';
    document.getElementById('levelMeter').classList.add('visible');
    showPlayPause(true);
    updatePlayPauseIcon();

    audioEl.addEventListener('ended', () => {
        audioState = 'paused';
        updatePlayPauseIcon();
        document.getElementById('status').textContent = 'Ended';
    });
}

function stopFile() {
    if (audioEl) {
        audioEl.pause();
        audioEl.src = '';
        audioEl = null;
    }
    if (audioSource) { audioSource.disconnect(); audioSource = null; }
    document.getElementById('fileName').classList.remove('visible');
    document.getElementById('levelMeter').classList.remove('visible');
    showPlayPause(false);
    if (audioState === 'playing' || audioState === 'paused') {
        audioState = 'idle';
        document.getElementById('status').textContent = '';
    }
}

function togglePlayPause() {
    if (!audioEl) return;
    if (audioState === 'playing') {
        audioEl.pause();
        audioState = 'paused';
        document.getElementById('status').textContent = 'Paused';
    } else {
        audioEl.play();
        audioState = 'playing';
        document.getElementById('status').textContent = 'Playing';
    }
    updatePlayPauseIcon();
}

function showPlayPause(show) {
    document.getElementById('playPauseBtn').style.display = show ? 'flex' : 'none';
}

function updatePlayPauseIcon() {
    const playing = audioState === 'playing';
    document.getElementById('playIcon').style.display = playing ? 'none' : 'block';
    document.getElementById('pauseIcon').style.display = playing ? 'block' : 'none';
}

function updateAudioData() {
    if (!analyser || !freqData || audioState === 'idle') {
        // Decay to zero
        bands.bass    *= 0.92;
        bands.lowMid  *= 0.92;
        bands.mid     *= 0.92;
        bands.highMid *= 0.92;
        bands.high    *= 0.92;
        return;
    }
    analyser.getByteFrequencyData(freqData);

    const bins = freqData.length; // 256 bins with fftSize 512

    const avg = (arr, s, e) => {
        let sum = 0;
        for (let i = s; i < e; i++) sum += arr[i];
        return (sum / (e - s)) / 255.0;
    };

    const g = gain;
    // Frequency bands mapped for 256 bins (~86 Hz per bin at 44.1kHz)
    // Capped at 1.5 to allow headroom for dramatic spikes
    const raw = {
        bass:    Math.min(avg(freqData, 0, 8)    * g, 1.5),
        lowMid:  Math.min(avg(freqData, 8, 24)   * g, 1.5),
        mid:     Math.min(avg(freqData, 24, 64)  * g, 1.5),
        highMid: Math.min(avg(freqData, 64, 128) * g, 1.5),
        high:    Math.min(avg(freqData, 128, bins) * g, 1.5)
    };

    // Smooth (lower = more responsive)
    const s = 0.35;
    bands.bass    += (raw.bass    - bands.bass)    * s;
    bands.lowMid  += (raw.lowMid  - bands.lowMid)  * s;
    bands.mid     += (raw.mid     - bands.mid)     * s;
    bands.highMid += (raw.highMid - bands.highMid) * s;
    bands.high    += (raw.high    - bands.high)    * s;

    // Update level meter
    const overall = (bands.bass + bands.lowMid + bands.mid + bands.highMid + bands.high) / 5;
    const levelBar = document.getElementById('levelBar');
    if (levelBar) levelBar.style.width = Math.min(overall * 100 * 2, 100) + '%';
}

// ---- UI EVENT HANDLERS ----
document.getElementById('micBtn').addEventListener('click', () => {
    if (audioState === 'mic') stopMic();
    else startMic();
});

document.getElementById('fileBtn').addEventListener('click', () => {
    document.getElementById('fileInput').click();
});

document.getElementById('fileInput').addEventListener('change', e => {
    const file = e.target.files[0];
    if (file) loadFile(file);
    e.target.value = ''; // allow reloading same file
});

document.getElementById('playPauseBtn').addEventListener('click', togglePlayPause);

document.getElementById('gainSlider').addEventListener('input', e => {
    gain = parseFloat(e.target.value);
});

// ---- VIEW MODES ----
const VIEW_MODES = {
    free:      { frame: false, glow: false, label: 'Free' },
    display:   { frame: true,  glow: true,  label: 'Display' },
    spotlight: { frame: false, glow: true,  label: 'Spotlight' }
};
let currentView = 'free';

function setView(mode) {
    const v = VIEW_MODES[mode];
    if (!v) return;
    currentView = mode;
    // Frame
    document.getElementById('frame').classList.toggle('active', v.frame);
    // Glow
    glowEnabled = v.glow;
    glowSprite.visible = v.glow;
    // Update buttons
    document.querySelectorAll('.view-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.view === mode);
    });
}

document.querySelectorAll('.view-btn').forEach(btn => {
    btn.addEventListener('click', () => setView(btn.dataset.view));
});

// ---- RESIZE ----
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---- ANIMATION LOOP ----
const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);

    const t = clock.getElapsedTime();

    // Update audio
    updateAudioData();

    // Update spikes
    updateSpikes(t, bands);

    // Smooth theme transitions
    currentBg.lerp(targetBg, 0.04);
    renderer.setClearColor(currentBg);
    coreMat.color.lerp(targetLiquid, 0.04);
    coreMat.specular.lerp(targetSpec, 0.04);
    spikeMat.color.lerp(targetLiquid, 0.04);
    spikeMat.specular.lerp(targetSpec, 0.04);

    // Total energy for reactive effects
    const totalEnergy = (bands.bass + bands.lowMid + bands.mid + bands.highMid + bands.high) / 5;

    // Glow: smooth color transition + audio pulse
    if (glowEnabled) {
        glowMat.color.lerp(targetGlow, 0.04);
        glowMat.opacity = 0.4 + totalEnergy * 0.8;
        const glowScale = 4.0 + totalEnergy * 3.0;
        glowSprite.scale.set(glowScale, glowScale, 1);
    }

    // ---- ORGANISM MOTION ----
    const cappedEnergy = Math.min(totalEnergy, 0.5);
    organism.rotation.y += 0.0008 + cappedEnergy * 0.004;
    organism.rotation.x = Math.sin(t * 0.12) * 0.02;
    organism.rotation.z = Math.cos(t * 0.1) * 0.015;

    // Update orbit camera
    orbit.update();

    renderer.render(scene, camera);
}

animate();
</script>
